[project]
name = "lpad"
version = "0.1.0"
description = "Launchpad-style application launcher"
authors = [
  { name = "Launchpad Developers" }
]
requires-python = ">=3.9"
dependencies = [
  "PySide6>=6.5",
]

[project.scripts]
launchpad = "lpad.app:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
